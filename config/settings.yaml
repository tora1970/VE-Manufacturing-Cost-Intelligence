application:
  name: VE Manufacturing Cost Intelligence
  short_name: VEMCI
  currency: EUR
  default_region: Czech Republic

github:
  owner: tora1970
  repository: VEMCI-Masterdata
  branch: main
  private_repository: false
  token_environment_variable: VEMCI_GITHUB_TOKEN
  timeout_seconds: 30

cache:
  enabled: true
  directory: cache
  ttl_hours: 24
  allow_stale_on_error: true

masterdata:
  materials: materials/Materials.xlsx
  regions: regions/Regions.xlsx
  technologies: technologies/Technologies.xlsx
  technology_rules: technologies/Technology_Rules.xlsx
  technology_cost_library: technologies/Technology_Cost_Library.xlsx
  hpdc_machines: hpdc/Machines.xlsx
  hpdc_alloys: hpdc/Alloys.xlsx
  hpdc_parameters: hpdc/Parameters.xlsx

hpdc_defaults:
  annual_volume: 25000
  part_weight_kg: 0.85
  casting_yield: 0.65
  cycle_time_s: 35.0
  cavities: 1
  oee: 0.75
  scrap_rate: 0.03
  operators: 0.5
  tooling_cost_eur: 120000.0
  tool_life_shots: 150000
  overhead_rate: 0.12
