application:
  name: VE Manufacturing Cost Intelligence
  short_name: VEMCI
  currency: EUR
  default_region: Czech Republic

github:
  owner: tora1970
  repository: VE-Manufacturing-Cost-Intelligence
  branch: main
  private_repository: false
  token_environment_variable: VEMCI_GITHUB_TOKEN
  timeout_seconds: 30

cache:
  enabled: true
  directory: cache
  ttl_hours: 24
  allow_stale_on_error: true

masterdata:
  materials: Masterdata/Materials.xlsx
  regions: Masterdata/Regions.xlsx
  technologies: Masterdata/Technologies.xlsx
  technology_rules: Masterdata/Technology_Rules.xlsx
  technology_cost_library: Masterdata/Technology_Cost_Library.xlsx
  machine: Masterdata/Machine.xlsx

hpdc_defaults:
  annual_volume: 25000
  part_weight_kg: 0.85
  casting_yield: 0.65
  layout_factor: 1.25
  cavities: 1
  oee: 0.75
  scrap_rate: 0.03
  operators: 0.5
  tooling_cost_eur: 120000.0
  tool_life_shots: 150000
  overhead_rate: 0.12

# Engineering assumptions for HPDC cycle-time screening V1; these are not
# measured machine data, material masterdata, or verified physical constants.
hpdc_cycle_time_v1:
  model_name: "Engineering Estimate V1"
  nominal_wall_thickness_default_mm: 3.0
  nominal_wall_thickness_min_mm: 0.5
  nominal_wall_thickness_max_mm: 20.0
  cooling_coefficient_s_per_mm_n: 2.5
  cooling_exponent: 2.0
  assumed_fill_rate_kg_s: 1.5
  minimum_fill_time_s: 0.2
  maximum_fill_time_s: 3.0
  die_close_time_s: 2.0
  hold_time_s: 2.0
  die_open_time_s: 2.0
  ejection_time_s: 1.2
  spray_handling_time_s: 3.0
